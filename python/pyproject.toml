[project]
name = "tarifftrust"
version = "0.2.0"
description = "Official Python client for the TariffTrust API: every US import duty and fee for an HTS code, an origin and a value, each with its official source."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TariffTrust", email = "contact@tarifftrust.com" }]
keywords = [
    "tariff",
    "tariffs",
    "hts",
    "harmonized-tariff-schedule",
    "customs",
    "import-duty",
    "landed-cost",
    "section-301",
    "section-232",
    "trade-compliance",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.urls]
Homepage = "https://tarifftrust.com/api/"
Documentation = "https://tarifftrust.com/api/reference/"
Guides = "https://tarifftrust.com/guides/"
Repository = "https://github.com/tarifftrust/tarifftrust"
Changelog = "https://tarifftrust.com/changelog/"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarifftrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/tarifftrust/types.py", "src/tarifftrust/_operations.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
